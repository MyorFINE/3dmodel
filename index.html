
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Character World</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;width:100%;height:100%;
    overflow:hidden;background:#111;
    font-family:Arial,sans-serif;
}
canvas{display:block;width:100%;height:100%}

#loading{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;
    background:radial-gradient(circle at center,#243344,#080d14);
    color:white;
}
.loader{
    width:52px;height:52px;border-radius:50%;
    border:4px solid #ffffff22;
    border-top-color:#49baff;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{font-size:14px;color:#d8e7f4}
#loadError{
    max-width:90%;color:#ff8585;
    text-align:center;font-size:13px;
}
#hud{
    position:fixed;top:18px;left:18px;
    color:white;z-index:10;pointer-events:none;
    text-shadow:0 2px 5px black;
    font-size:13px;line-height:1.8;
}
#crosshair{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:5px;height:5px;border-radius:50%;
    background:#fff8;pointer-events:none;
}
#help{
    position:fixed;bottom:18px;left:50%;
    transform:translateX(-50%);
    color:#fff;background:#101820bb;
    padding:10px 16px;border-radius:10px;
    font-size:12px;white-space:nowrap;
    pointer-events:none;
}
#errorPanel{
    display:none;position:fixed;bottom:65px;left:15px;
    right:15px;max-height:30vh;overflow:auto;
    background:#330e0e;color:#ffb4b4;
    padding:12px;border-radius:8px;font-size:12px;
    z-index:200;white-space:pre-wrap;
}
</style>

<!-- Import map MUST be before module script -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="loading">
    <div class="loader" id="loader"></div>
    <div id="loadingText">3D dunyo yuklanmoqda...</div>
    <div id="loadError"></div>
</div>

<div id="hud">
    <b>CHARACTER WORLD</b><br>
    Holat: <span id="state">Yuklanmoqda</span><br>
    FPS: <span id="fps">0</span>
</div>

<div id="crosshair"></div>

<div id="help">
    WASD — Harakat | SHIFT — Yugurish | SPACE — Sakrash | Sichqoncha — Kamera
</div>

<div id="errorPanel"></div>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

/* =====================================================
   CONFIGURATION
===================================================== */

const CONFIG = {
    files: {
        idle: "idle.fbx",
        walk: "standartwalk.fbx",

        textures: {
            suit: "male_casualsuit03_diffuse.png",
            normal: "male_casualsuit03_normal.png",
            body: "middleage_lightskinned_male_diffuse2.png",
            hair: "short02_diffuse.png",
            shoes: "shoes05_diffuse.png",
            eyes: "brown_eye.png",
            eyebrow: "eyebrow004.png",
            eyelashes: "eyelashes01.png",
            teeth: "teeth.png",
            tongue: "tongue01_diffuse.png"
        }
    },

    characterHeight: 1.75,

    movement: {
        walkSpeed: 2.0,
        runSpeed: 4.5,
        jumpSpeed: 5.5,
        gravity: 15
    },

    camera: {
        distance: 4.5,
        height: 2.15,
        sensitivity: 0.003,
        minPitch: -0.45,
        maxPitch: 0.85
    },

    // If your character faces the wrong direction, adjust this.
    modelRotationY: 0,

    // Manual texture mapping:
    // Add actual FBX material or mesh names here after checking console.
    // Example: "Body_Material": "body"
    materialOverrides: {
        // "Material.001": "body",
        // "Suit_Material": "suit"
    },

    meshOverrides: {
        // "BodyMesh": "body",
        // "HairMesh": "hair"
    }
};

/* =====================================================
   GLOBALS
===================================================== */

const $ = id => document.getElementById(id);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db6c9);
scene.fog = new THREE.Fog(0x9db6c9, 45, 180);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const loader = new FBXLoader();
const textureLoader = new THREE.TextureLoader();

let character = null;
let mixer = null;
let idleAction = null;
let walkAction = null;
let currentAction = null;
let ready = false;

const keys = {};
const velocity = new THREE.Vector3();

let yaw = 0;
let pitch = 0.12;
let verticalVelocity = 0;
let grounded = true;
let cameraDistance = CONFIG.camera.distance;

let fpsFrames = 0;
let fpsTime = 0;

/* =====================================================
   LOADING SYSTEM
===================================================== */

function status(message) {
    $("loadingText").textContent = message;
    console.log("[LOAD]", message);
}

function showError(error) {
    console.error(error);

    $("loader").style.display = "none";
    $("loadingText").textContent = "Yuklashda xatolik yuz berdi";
    $("loadError").textContent =
        error?.message || String(error);

    $("errorPanel").style.display = "block";
    $("errorPanel").textContent =
        error?.stack || String(error);
}

function finishLoading() {
    ready = true;
    $("loading").style.display = "none";
    $("state").textContent = "Tayyor";
    console.log("GAME READY");
}

/* =====================================================
   WORLD
===================================================== */

function createWorld() {
    const hemi = new THREE.HemisphereLight(
        0xe5f3ff,
        0x596044,
        2.0
    );
    scene.add(hemi);

    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff1d8, 3.0);
    sun.position.set(-25, 40, 20);
    sun.castShadow = true;

    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;

    scene.add(sun);

    const groundGeometry = new THREE.PlaneGeometry(10000, 10000);
    const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x65785c,
        roughness: 1
    });

    const ground = new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(
        200,
        100,
        0x536b52,
        0x71816b
    );
    grid.position.y = 0.005;
    grid.material.transparent = true;
    grid.material.opacity = 0.15;
    scene.add(grid);
}

/* =====================================================
   TEXTURE LOADING
===================================================== */

const textures = {};

async function loadTextures() {
    const entries = Object.entries(CONFIG.files.textures);

    for (const [name, file] of entries) {
        status("Tekstura yuklanmoqda: " + name);

        try {
            const texture = await textureLoader.loadAsync(file);

            texture.flipY = false;
            texture.colorSpace =
                name === "normal"
                    ? THREE.NoColorSpace
                    : THREE.SRGBColorSpace;

            texture.anisotropy =
                renderer.capabilities.getMaxAnisotropy();

            textures[name] = texture;

            console.log("[TEXTURE OK]", name, file);
        } catch (error) {
            console.error("[TEXTURE FAILED]", name, file, error);
            // Missing optional textures should not block character loading.
        }
    }

    console.log("Loaded textures:", Object.keys(textures));
}

/* =====================================================
   MATERIAL DETECTION
===================================================== */

function detectTexture(meshName, materialName) {
    const mesh = (meshName || "").toLowerCase();
    const mat = (materialName || "").toLowerCase();

    const override =
        CONFIG.materialOverrides[materialName] ||
        CONFIG.meshOverrides[meshName];

    if (override && textures[override]) {
        return override;
    }

    const combined = mesh + " " + mat;

    if (/shoe|boot|sneaker|footwear/.test(combined)) return "shoes";
    if (/hair|hairstyle/.test(combined)) return "hair";
    if (/eyebrow|brow/.test(combined)) return "eyebrow";
    if (/eyelash|lash/.test(combined)) return "eyelashes";
    if (/teeth|tooth/.test(combined)) return "teeth";
    if (/tongue/.test(combined)) return "tongue";
    if (/eye|iris|pupil/.test(combined)) return "eyes";
    if (/suit|jacket|shirt|trouser|pants|cloth|tie/.test(combined)) return "suit";
    if (/body|skin|face|head|arm|leg|hand|neck|torso/.test(combined)) return "body";

    return null;
}

function fixMaterial(material, meshName) {
    const mats = Array.isArray(material) ? material : [material];

    return mats.map(mat => {
        const name = mat.name || "";
        const textureName = detectTexture(meshName, name);

        // Preserve FBX's existing texture if it exists.
        if (!mat.map && textureName && textures[textureName]) {
            mat.map = textures[textureName];
        }

        if (textureName === "suit" && textures.normal && !mat.normalMap) {
            mat.normalMap = textures.normal;
            mat.normalScale.set(0.45, 0.45);
        }

        // Prevent black material caused by a black base color.
        if (!mat.color) {
            mat.color = new THREE.Color(0xffffff);
        } else if (
            mat.color.r < 0.02 &&
            mat.color.g < 0.02 &&
            mat.color.b < 0.02
        ) {
            mat.color.set(0xffffff);
        }

        mat.needsUpdate = true;

        console.log("[MATERIAL]", {
            mesh: meshName,
            material: name,
            selectedTexture: textureName,
            hasMap: !!mat.map
        });

        return mat;
    });
}

/* =====================================================
   CHARACTER PREPARATION
===================================================== */

function prepareCharacter(model) {
    const visualRoot = new THREE.Group();
    visualRoot.name = "CharacterVisual";

    model.traverse(obj => {
        if (!obj.isMesh) return;

        obj.castShadow = true;
        obj.receiveShadow = true;

        obj.material = fixMaterial(obj.material, obj.name);

        if (obj.geometry) {
            obj.geometry.computeBoundingSphere();
        }
    });

    // Normalize model dimensions.
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);

    const height = size.y;

    if (!height || !Number.isFinite(height)) {
        throw new Error("FBX model balandligini aniqlab bo‘lmadi.");
    }

    const scale = CONFIG.characterHeight / height;
    model.scale.setScalar(scale);

    // Recalculate bounds after scaling.
    const scaledBox = new THREE.Box3().setFromObject(model);

    model.position.y -= scaledBox.min.y;
    model.rotation.y = CONFIG.modelRotationY;

    visualRoot.add(model);

    console.log("Model height:", height);
    console.log("Model scale:", scale);

    return visualRoot;
}

/* =====================================================
   ANIMATION HELPERS
===================================================== */

function removeRootTranslation(clip) {
    const clone = clip.clone();

    for (const track of clone.tracks) {
        if (
            track.name.toLowerCase().includes("mixamorighips.position")
        ) {
            const values = track.values;

            if (values.length >= 3) {
                const x = values[0];
                const z = values[2];

                for (let i = 0; i < values.length; i += 3) {
                    values[i] = x;
                    values[i + 2] = z;
                }
            }
        }
    }

    return clone;
}

function setupAnimations(idleFBX, walkFBX, target) {
    if (!idleFBX.animations.length) {
        throw new Error("Idle FBX ichida animatsiya topilmadi.");
    }

    if (!walkFBX.animations.length) {
        throw new Error("Walk FBX ichida animatsiya topilmadi.");
    }

    const idleClip = idleFBX.animations[0].clone();
    const walkClip = removeRootTranslation(walkFBX.animations[0]);

    console.log("IDLE TRACKS:", idleClip.tracks.length);
    console.log("WALK TRACKS:", walkClip.tracks.length);

    console.table(walkClip.tracks.map(track => ({
        track: track.name,
        type: track.ValueTypeName
    })));

    mixer = new THREE.AnimationMixer(target);

    idleAction = mixer.clipAction(idleClip);
    walkAction = mixer.clipAction(walkClip);

    idleAction.enabled = true;
    walkAction.enabled = true;

    idleAction.setEffectiveWeight(1);
    walkAction.setEffectiveWeight(0);

    idleAction.play();
    walkAction.play();

    currentAction = idleAction;
}

function setAnimation(moving) {
    if (!idleAction || !walkAction) return;

    const next = moving ? walkAction : idleAction;

    if (currentAction === next) return;

    next.enabled = true;
    next.reset();
    next.setEffectiveWeight(1);

    currentAction.crossFadeTo(next, 0.22, false);
    next.play();

    currentAction = next;
}

/* =====================================================
   LOAD CHARACTER
===================================================== */

async function loadCharacter() {
    status("Teksturalar yuklanmoqda...");
    await loadTextures();

    status("Idle modeli yuklanmoqda...");
    const idleFBX = await loader.loadAsync(CONFIG.files.idle);

    status("Walk modeli yuklanmoqda...");
    const walkFBX = await loader.loadAsync(CONFIG.files.walk);

    status("Personaj tayyorlanmoqda...");

    character = prepareCharacter(idleFBX);

    scene.add(character);

    setupAnimations(idleFBX, walkFBX, character);

    character.position.set(0, 0, 0);

    status("Dunyo tayyorlanmoqda...");
    finishLoading();
}

/* =====================================================
   CAMERA
===================================================== */

function updateCamera(delta) {
    if (!character) return;

    const target = new THREE.Vector3(
        character.position.x,
        character.position.y + CONFIG.camera.height,
        character.position.z
    );

    const horizontal = Math.cos(pitch) * cameraDistance;
    const vertical = Math.sin(pitch) * cameraDistance;

    const desired = new THREE.Vector3(
        target.x + Math.sin(yaw) * horizontal,
        target.y + vertical,
        target.z + Math.cos(yaw) * horizontal
    );

    camera.position.lerp(
        desired,
        1 - Math.exp(-7 * delta)
    );

    camera.lookAt(target);
}

/* =====================================================
   INPUT
===================================================== */

window.addEventListener("keydown", event => {
    keys[event.code] = true;

    if (
        event.code === "Space" &&
        grounded &&
        ready
    ) {
        verticalVelocity = CONFIG.movement.jumpSpeed;
        grounded = false;
    }
});

window.addEventListener("keyup", event => {
    keys[event.code] = false;
});

renderer.domElement.addEventListener("click", () => {
    if (!document.pointerLockElement && ready) {
        renderer.domElement.requestPointerLock();
    }
});

document.addEventListener("mousemove", event => {
    if (document.pointerLockElement !== renderer.domElement) return;

    yaw -= event.movementX * CONFIG.camera.sensitivity;
    pitch -= event.movementY * CONFIG.camera.sensitivity;

    pitch = THREE.MathUtils.clamp(
        pitch,
        CONFIG.camera.minPitch,
        CONFIG.camera.maxPitch
    );
});

renderer.domElement.addEventListener("wheel", event => {
    cameraDistance += event.deltaY * 0.005;
    cameraDistance = THREE.MathUtils.clamp(
        cameraDistance,
        2.2,
        9
    );
});

/* =====================================================
   MOVEMENT
===================================================== */

function updateMovement(delta) {
    if (!character || !ready) return;

    let forward = 0;
    let side = 0;

    if (keys.KeyW || keys.ArrowUp) forward += 1;
    if (keys.KeyS || keys.ArrowDown) forward -= 1;
    if (keys.KeyA || keys.ArrowLeft) side -= 1;
    if (keys.KeyD || keys.ArrowRight) side += 1;

    const moving = forward !== 0 || side !== 0;

    const direction = new THREE.Vector3();

    if (moving) {
        direction.set(side, 0, forward).normalize();

        const cameraForward = new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

        const cameraRight = new THREE.Vector3(
            -cameraForward.z,
            0,
            cameraForward.x
        );

        const movement = new THREE.Vector3()
            .addScaledVector(cameraForward, direction.z)
            .addScaledVector(cameraRight, direction.x)
            .normalize();

        const targetAngle = Math.atan2(
            movement.x,
            movement.z
        );

        // Adjust model facing direction here if needed.
        const modelFacing = targetAngle;

        const angleDifference = Math.atan2(
            Math.sin(modelFacing - character.rotation.y),
            Math.cos(modelFacing - character.rotation.y)
        );

        character.rotation.y += angleDifference *
            (1 - Math.exp(-12 * delta));

        const running = keys.ShiftLeft || keys.ShiftRight;

        const speed = running
            ? CONFIG.movement.runSpeed
            : CONFIG.movement.walkSpeed;

        character.position.addScaledVector(
            movement,
            speed * delta
        );
    }

    if (!grounded) {
        verticalVelocity -= CONFIG.movement.gravity * delta;
        character.position.y += verticalVelocity * delta;

        if (character.position.y <= 0) {
            character.position.y = 0;
            verticalVelocity = 0;
            grounded = true;
        }
    }

    setAnimation(moving);

    if (mixer) {
        mixer.update(delta);
    }

    $("state").textContent =
        moving
            ? (keys.ShiftLeft || keys.ShiftRight ? "Yugurmoqda" : "Yurmoqda")
            : "Idle";
}

/* =====================================================
   MAIN LOOP
===================================================== */

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (ready) {
        updateMovement(delta);
        updateCamera(delta);
    }

    renderer.render(scene, camera);

    fpsFrames++;
    fpsTime += delta;

    if (fpsTime >= 0.5) {
        $("fps").textContent = Math.round(fpsFrames / fpsTime);
        fpsFrames = 0;
        fpsTime = 0;
    }
}

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);
});

/* =====================================================
   START
===================================================== */

async function start() {
    try {
        createWorld();

        camera.position.set(0, 2.5, 5);
        camera.lookAt(0, 1, 0);

        animate();

        await loadCharacter();

        updateCamera(1 / 60);

    } catch (error) {
        showError(error);
    }
}

start();

</script>
</body>
</html>
