
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open World - Third Person</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#8998a2;font-family:Arial}
canvas{display:block}

#loading{
 position:fixed;inset:0;background:#10141a;color:white;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:14px;z-index:100
}
#loading small{color:#9ba9b8}
#bar{width:220px;height:3px;background:#333;overflow:hidden}
#bar span{
 display:block;height:100%;width:40%;
 background:#65b8ff;animation:load 1.3s infinite
}
@keyframes load{
 from{transform:translateX(-100%)}
 to{transform:translateX(350%)}
}

#start{
 position:fixed;inset:0;z-index:50;
 display:flex;align-items:center;justify-content:center;
 background:#0007
}
#start button{
 background:#171c24;color:white;
 border:1px solid #718096;
 padding:18px 40px;border-radius:6px;
 cursor:pointer;font-size:15px;letter-spacing:1px
}
#start button:hover{background:#303b4a}

#hud{
 position:fixed;top:20px;left:20px;
 color:white;background:#10151cdd;
 padding:15px 19px;border-radius:9px;
 border:1px solid #ffffff20;
 font-size:12px;line-height:2;
 pointer-events:none
}
#hud strong{font-size:14px;letter-spacing:1px}

#status{
 position:fixed;top:20px;right:20px;
 color:white;background:#10151cdd;
 padding:12px 18px;border-radius:7px;
 font-size:12px
}
#statusDot{
 display:inline-block;width:7px;height:7px;
 border-radius:50%;background:#5bdf91;margin-right:7px
}
#bottom{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);
 background:#10151cbb;color:white;
 padding:10px 18px;border-radius:6px;
 font-size:11px;pointer-events:none
}
</style>
</head>

<body>

<div id="loading">
 <h2>OPEN WORLD SYSTEM</h2>
 <small id="loadText">3D personaj yuklanmoqda...</small>
 <div id="bar"><span></span></div>
</div>

<div id="start">
 <button id="startBtn">START GAME</button>
</div>

<div id="hud">
 <strong>OPEN WORLD</strong><br>
 W A S D — Harakat<br>
 SHIFT — Yugurish<br>
 MOUSE — Kamera<br>
 ESC — Sichqonchani bo'shatish<br>
 SPACE — Sakrash
</div>

<div id="status">
 <span id="statusDot"></span>IDLE
</div>

<div id="bottom">
 THIRD PERSON · FREE MOVEMENT · OPEN WORLD
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

// ======================================================
// 1. CONFIGURATION
// ======================================================

const CONFIG={

 // Character
 characterHeight:1.75,

 // Movement
 walkSpeed:2.0,
 sprintSpeed:4.2,
 acceleration:9,
 deceleration:12,
 turnSpeed:11,

 // Set Math.PI if your model faces the opposite direction
 modelForwardOffset:0,

 // Camera
 cameraDistance:4.7,
 cameraHeight:0.20,
 cameraTargetHeight:1.15,
 cameraSensitivity:0.0025,
 cameraSmooth:9,

 minPitch:-0.3,
 maxPitch:0.65,

 // Animation
 animationFade:0.22,
 walkAnimationSpeed:1,
 sprintAnimationSpeed:1.35,

 // Physics
 gravity:18,
 jumpForce:6,

 // World
 worldSize:10000,

};

// ======================================================
// 2. RENDERER
// ======================================================

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x9aaab8);
scene.fog=new THREE.Fog(0x9aaab8,100,500);

const camera=new THREE.PerspectiveCamera(
 55,innerWidth/innerHeight,0.1,2000
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

// ======================================================
// 3. LIGHTING
// ======================================================

scene.add(new THREE.HemisphereLight(
 0xffffff,0x626a59,2
));

const sun=new THREE.DirectionalLight(0xffffff,3);

sun.position.set(-20,35,20);
sun.castShadow=true;

sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-40;
sun.shadow.camera.right=40;
sun.shadow.camera.top=40;
sun.shadow.camera.bottom=-40;
sun.shadow.bias=-0.0002;

scene.add(sun);

// ======================================================
// 4. OPEN WORLD
// ======================================================

// No movement boundary.
// Character can travel freely on the large world plane.

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(
  CONFIG.worldSize,
  CONFIG.worldSize
 ),
 new THREE.MeshStandardMaterial({
  color:0x68765d,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Distant environment reference grid
const grid=new THREE.GridHelper(
 1000,100,0x888888,0x999999
);

grid.position.y=0.01;
grid.material.transparent=true;
grid.material.opacity=0.08;
scene.add(grid);

// ======================================================
// 5. TEXTURE LOADING
// ======================================================

const textureLoader=new THREE.TextureLoader();

const textureFiles={
 suit:'male_casualsuit03_diffuse.png',
 normal:'male_casualsuit03_normal.png',
 body:'middleage_lightskinned_male_diffuse2.png',
 hair:'short02_diffuse.png',
 shoes:'shoes05_diffuse.png',
 eyes:'brown_eye.png',
 eyebrow:'eyebrow004.png',
 eyelashes:'eyelashes01.png',
 teeth:'teeth.png',
 tongue:'tongue01_diffuse.png'
};

const textures={};

async function loadAllTextures(){

 const entries=Object.entries(textureFiles);

 await Promise.all(entries.map(async([key,file])=>{

  try{

   const texture=await textureLoader.loadAsync(file);

   texture.flipY=false;

   if(key==='normal'){
    texture.colorSpace=THREE.NoColorSpace;
   }else{
    texture.colorSpace=THREE.SRGBColorSpace;
   }

   texture.wrapS=THREE.RepeatWrapping;
   texture.wrapT=THREE.RepeatWrapping;

   textures[key]=texture;

   console.log('Texture loaded:',key);

  }catch(error){

   console.error('Texture failed:',file,error);

  }

 }));

}

// ======================================================
// 6. TEXTURE MATERIAL DETECTION
// ======================================================

function detectTexture(meshName,materialName){

 const n=(
  meshName+' '+materialName
 ).toLowerCase().replace(/[\s_\-.:]/g,'');

 if(/shoe|shoes|boot|footwear/.test(n)){
  return 'shoes';
 }

 if(/eyebrow|brow/.test(n)){
  return 'eyebrow';
 }

 if(/eyelash|lash/.test(n)){
  return 'eyelashes';
 }

 if(/teeth|tooth/.test(n)){
  return 'teeth';
 }

 if(/tongue/.test(n)){
  return 'tongue';
 }

 if(/eyeball|eyepart|eye/.test(n)){
  return 'eyes';
 }

 if(/hair|hairstyle/.test(n)){
  return 'hair';
 }

 if(/suit|jacket|coat|shirt|trouser|pants|clothes|cloth/.test(n)){
  return 'suit';
 }

 if(/skin|body|face|head|arm|hand|neck|leg|foot/.test(n)){
  return 'body';
 }

 return null;

}

function setupMaterials(model){

 const report=[];

 model.traverse(obj=>{

  if(!obj.isMesh)return;

  obj.castShadow=true;
  obj.receiveShadow=true;

  const materials=Array.isArray(obj.material)
   ?obj.material:[obj.material];

  materials.forEach(mat=>{

   if(!mat)return;

   const textureKey=detectTexture(
    obj.name,
    mat.name||''
   );

   report.push({
    mesh:obj.name,
    material:mat.name,
    texture:textureKey||'NOT DETECTED'
   });

   if(textureKey&&textures[textureKey]){

    mat.map=textures[textureKey];

    if(textureKey==='suit'&&textures.normal){
     mat.normalMap=textures.normal;
     mat.normalScale.set(1,1);
    }

    if(textureKey==='hair'||textureKey==='eyelashes'){
     mat.alphaTest=0.1;
    }

    mat.needsUpdate=true;

   }

  });

 });

 console.table(report);

}

// ======================================================
// 7. CHARACTER ROOT
// ======================================================

// Controller root is independent from the animated FBX.
// This is the most important part of the movement system.

const characterRoot=new THREE.Group();
scene.add(characterRoot);

const visualRoot=new THREE.Group();
characterRoot.add(visualRoot);

let character=null;
let mixer=null;

let idleAction=null;
let walkAction=null;

let currentAction=null;
let loaded=false;

// ======================================================
// 8. MODEL NORMALIZATION
// ======================================================

function prepareCharacter(model){

 setupMaterials(model);

 const originalBox=new THREE.Box3().setFromObject(model);
 const originalSize=originalBox.getSize(new THREE.Vector3());

 if(originalSize.y<=0){
  throw new Error('FBX model height is invalid');
 }

 const scale=CONFIG.characterHeight/originalSize.y;

 model.scale.setScalar(scale);

 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());

 // Center model at controller origin
 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=box.min.y;

 model.rotation.y=CONFIG.modelForwardOffset;

 visualRoot.add(model);

 character=model;

 console.log('Model size:',originalSize);
 console.log('Normalized height:',CONFIG.characterHeight);

}

// ======================================================
// 9. ROOT MOTION REMOVAL
// ======================================================

// Remove horizontal root movement from the walking animation.
// ControllerRoot handles all world movement independently.

function makeInPlaceAnimation(original){

 const clip=original.clone();

 clip.tracks=clip.tracks.filter(track=>{

  const name=track.name.toLowerCase();

  if(!name.endsWith('.position')){
   return true;
  }

  // Remove object-level root movement
  const rootObject=(
   /^(armature|root|scene|group|rootnode)\.position$/.test(name)
  );

  if(rootObject){
   return false;
  }

  // Freeze horizontal displacement of root/hips bones.
  // Preserve Y for natural body bounce.

  if(/hips|pelvis|root/.test(name)){

   const values=track.values;

   if(values.length>=3){

    const initialX=values[0];
    const initialZ=values[2];

    for(let i=0;i<values.length;i+=3){

     values[i]=initialX;
     values[i+2]=initialZ;

    }

   }

  }

  return true;

 });

 clip.resetDuration();

 console.log('In-place clip:',clip.name);

 return clip;

}

// ======================================================
// 10. ANIMATION CONTROLLER
// ======================================================

function playAnimation(action){

 if(!action)return;

 if(currentAction===action)return;

 const previous=currentAction;

 action.enabled=true;
 action.reset();
 action.setEffectiveWeight(1);
 action.setEffectiveTimeScale(1);
 action.play();

 if(previous){

  previous.crossFadeTo(
   action,
   CONFIG.animationFade,
   false
  );

 }

 currentAction=action;

}

// ======================================================
// 11. LOAD FBX
// ======================================================

const fbxLoader=new FBXLoader();

async function loadCharacter(){

 const loadText=document.getElementById('loadText');

 try{

  await loadAllTextures();

  loadText.textContent='Idle character yuklanmoqda...';

  const idleModel=await fbxLoader.loadAsync('idle.fbx');

  prepareCharacter(idleModel);

  mixer=new THREE.AnimationMixer(character);

  if(idleModel.animations.length){

   const idleClip=idleModel.animations[0];

   idleAction=mixer.clipAction(idleClip,character);

   idleAction.setLoop(THREE.LoopRepeat);
   idleAction.play();

   currentAction=idleAction;

  }

  loadText.textContent='Walking animation yuklanmoqda...';

  const walkModel=await fbxLoader.loadAsync(
   'standartwalk.fbx'
  );

  if(walkModel.animations.length){

   const walkClip=makeInPlaceAnimation(
    walkModel.animations[0]
   );

   // Explicitly bind walk animation to idle character skeleton
   walkAction=mixer.clipAction(
    walkClip,
    character
   );

   walkAction.setLoop(THREE.LoopRepeat);
   walkAction.clampWhenFinished=false;

  }

  // Diagnostics for material and skeleton compatibility
  console.log('IDLE BONES:');
  character.traverse(obj=>{
   if(obj.isBone)console.log(obj.name);
  });

  console.log('WALK TRACKS:');
  console.table(
   walkModel.animations[0]?.tracks.map(t=>({
    track:t.name,
    type:t.ValueTypeName
   }))
  );

  loaded=true;

  loadText.textContent='Tayyor!';

  document.getElementById('loading').style.display='none';

 }catch(error){

  console.error(error);

  loadText.textContent='XATOLIK: '+error.message;

 }

}

await loadCharacter();

// ======================================================
// 12. INPUT
// ======================================================

const keys={};

window.addEventListener('keydown',e=>{

 keys[e.code]=true;

 if(e.code==='Space')e.preventDefault();

});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

window.addEventListener('blur',()=>{
 for(const key in keys)keys[key]=false;
});

// ======================================================
// 13. GAME START
// ======================================================

let started=false;

document.getElementById('startBtn').onclick=()=>{

 if(!loaded)return;

 started=true;

 document.getElementById('start').style.display='none';

 renderer.domElement.requestPointerLock();

};

renderer.domElement.addEventListener('click',()=>{

 if(started&&!document.pointerLockElement){
  renderer.domElement.requestPointerLock();
 }

});

// ======================================================
// 14. CAMERA CONTROL
// ======================================================

let cameraYaw=0;
let cameraPitch=0.08;
let cameraReady=false;

window.addEventListener('mousemove',e=>{

 if(!document.pointerLockElement)return;

 cameraYaw-=e.movementX*CONFIG.cameraSensitivity;

 cameraPitch-=e.movementY*CONFIG.cameraSensitivity;

 cameraPitch=THREE.MathUtils.clamp(
  cameraPitch,
  CONFIG.minPitch,
  CONFIG.maxPitch
 );

});

// ======================================================
// 15. MOVEMENT PHYSICS
// ======================================================

const velocity=new THREE.Vector3();
const desiredVelocity=new THREE.Vector3();

const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const inputDirection=new THREE.Vector3();

const clock=new THREE.Clock();

let verticalVelocity=0;
let grounded=true;

let state='IDLE';

function smoothAngle(current,target,dt){

 const difference=Math.atan2(
  Math.sin(target-current),
  Math.cos(target-current)
 );

 return current+
 difference*(1-Math.exp(-CONFIG.turnSpeed*dt));

}

// ======================================================
// 16. MOVEMENT UPDATE
// ======================================================

function updateMovement(dt){

 let f=0;
 let s=0;

 if(keys.KeyW||keys.ArrowUp)f++;
 if(keys.KeyS||keys.ArrowDown)f--;

 if(keys.KeyD||keys.ArrowRight)s++;
 if(keys.KeyA||keys.ArrowLeft)s--;

 const hasInput=f!==0||s!==0;

 const sprint=!!(
  keys.ShiftLeft||keys.ShiftRight
 );

 // Direction relative to camera

 forward.set(
  Math.sin(cameraYaw),
  0,
  -Math.cos(cameraYaw)
 );

 right.set(
  Math.cos(cameraYaw),
  0,
  Math.sin(cameraYaw)
 );

 inputDirection.set(0,0,0);

 inputDirection.addScaledVector(forward,f);
 inputDirection.addScaledVector(right,s);

 if(inputDirection.lengthSq()>0){
  inputDirection.normalize();
 }

 const speed=sprint
  ?CONFIG.sprintSpeed
  :CONFIG.walkSpeed;

 desiredVelocity.copy(inputDirection).multiplyScalar(
  hasInput?speed:0
 );

 // Smooth acceleration and deceleration
 const acceleration=hasInput
  ?CONFIG.acceleration
  :CONFIG.deceleration;

 const blend=1-Math.exp(-acceleration*dt);

 velocity.lerp(desiredVelocity,blend);

 if(velocity.length()<0.02&&!hasInput){
  velocity.set(0,0,0);
 }

 // World position ONLY controlled here.
 // Animation never controls characterRoot position.

 characterRoot.position.x+=velocity.x*dt;
 characterRoot.position.z+=velocity.z*dt;

 // Character orientation

 if(hasInput){

  const targetAngle=Math.atan2(
   inputDirection.x,
   inputDirection.z
  );

  characterRoot.rotation.y=smoothAngle(
   characterRoot.rotation.y,
   targetAngle,
   dt
  );

 }

 // Jump

 if(keys.Space&&grounded){

  verticalVelocity=CONFIG.jumpForce;
  grounded=false;

 }

 verticalVelocity-=CONFIG.gravity*dt;

 characterRoot.position.y+=verticalVelocity*dt;

 if(characterRoot.position.y<=0){

  characterRoot.position.y=0;
  verticalVelocity=0;
  grounded=true;

 }

 // Animation state

 const currentSpeed=velocity.length();
 const moving=currentSpeed>0.15;

 if(moving){

  playAnimation(walkAction);

  if(walkAction){

   const speedRatio=currentSpeed/CONFIG.walkSpeed;

   walkAction.timeScale=THREE.MathUtils.clamp(
    CONFIG.walkAnimationSpeed*speedRatio,
    0.7,
    1.8
   );

  }

  state=sprint&&currentSpeed>CONFIG.walkSpeed
   ?'SPRINT':'WALK';

 }else{

  playAnimation(idleAction);

  if(idleAction)idleAction.timeScale=1;

  state='IDLE';

 }

}

// ======================================================
// 17. CAMERA FOLLOW
// ======================================================

const cameraTarget=new THREE.Vector3();
const cameraDesired=new THREE.Vector3();

function updateCamera(dt){

 cameraTarget.set(
  characterRoot.position.x,
  characterRoot.position.y+
   CONFIG.cameraTargetHeight,
  characterRoot.position.z
 );

 const horizontal=
  CONFIG.cameraDistance*Math.cos(cameraPitch);

 cameraDesired.set(

  cameraTarget.x+
   Math.sin(cameraYaw)*horizontal,

  cameraTarget.y+
   CONFIG.cameraHeight+
   CONFIG.cameraDistance*Math.sin(cameraPitch),

  cameraTarget.z+
   Math.cos(cameraYaw)*horizontal

 );

 cameraDesired.y=Math.max(0.4,cameraDesired.y);

 const smooth=1-Math.exp(-CONFIG.cameraSmooth*dt);

 if(!cameraReady){

  camera.position.copy(cameraDesired);
  cameraReady=true;

 }else{

  camera.position.lerp(cameraDesired,smooth);

 }

 camera.lookAt(cameraTarget);

}

// ======================================================
// 18. MAIN LOOP
// ======================================================

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.033);

 if(mixer){
  mixer.update(dt);
 }

 if(started&&loaded){

  updateMovement(dt);
  updateCamera(dt);

  document.getElementById('status').innerHTML=
   '<span id="statusDot"></span>'+state;

 }

 renderer.render(scene,camera);

}

animate();

// ======================================================
// 19. RESIZE
// ======================================================

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
