<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Third-Person Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
    <!-- Three.js va zaruriy kutubxonalar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
</head>
<body>

    <div id="info">
        <h3>O'yin Boshqaruvi:</h3>
        <p><b>W, A, S, D</b> - Yurish</p>
        <p><b>Sichqoncha</b> - Kamerani aylantirish</p>
    </div>

    <script>
        let scene, camera, renderer;
        let model, mixer;
        let walkAction;
        let clock = new THREE.Clock();

        const keys = { w: false, a: false, s: false, d: false };

        // Kamera va personaj burchaklarini boshqarish uchun
        let cameraAngle = 0;
        let cameraRadius = 3.5; // Personajdan qanchalik uzoqligi
        let cameraHeight = 1.8; // Kameraning balandligi

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0a0a0);
            scene.fog = new THREE.Fog(0xa0a0a0, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 50, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Yer tekisligi
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false })
            );
            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const grid = new THREE.GridHelper(200, 100, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Teksturalarni yuklash
            const textureLoader = new THREE.TextureLoader();
            const textures = {
                body: textureLoader.load('middleage_lightskinned_male_diffuse2.png'),
                suit: textureLoader.load('male_casualsuit03_diffuse.png'),
                shoes: textureLoader.load('shoes05_diffuse.png'),
                shorts: textureLoader.load('short02_diffuse.png'),
                eyes: textureLoader.load('brown_eye.png'),
                teeth: textureLoader.load('teeth.png'),
                tongue: textureLoader.load('tongue01_diffuse.png')
            };

            const loader = new THREE.FBXLoader();
            loader.load('standartwalk.fbx', function (object) {
                model = object;
                
                // MASSHTABNI TO'G'RI TAYINLAYMIZ (Mixamo modellari uchun odatda 1 yoki 0.01 bo'ladi, 1 qilib ko'ramiz)
                model.scale.setScalar(1.0); 

                model.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        const matName = child.material.name ? child.material.name.toLowerCase() : '';
                        const meshName = child.name ? child.name.toLowerCase() : '';

                        if ((matName.includes('shoe') || meshName.includes('shoe')) && textures.shoes) {
                            child.material.map = textures.shoes;
                        } else if ((matName.includes('short') || meshName.includes('short')) && textures.shorts) {
                            child.material.map = textures.shorts;
                        } else if ((matName.includes('suit') || matName.includes('body') || meshName.includes('body')) && textures.suit) {
                            child.material.map = textures.suit;
                        } else if ((matName.includes('eye') || meshName.includes('eye')) && textures.eyes) {
                            child.material.map = textures.eyes;
                        } else if ((matName.includes('teeth') || meshName.includes('teeth')) && textures.teeth) {
                            child.material.map = textures.teeth;
                        } else if ((matName.includes('tongue') || meshName.includes('tongue')) && textures.tongue) {
                            child.material.map = textures.tongue;
                        } else if (textures.body) {
                            child.material.map = textures.body;
                        }

                        child.material.needsUpdate = true;
                    }
                });

                if (object.animations && object.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    walkAction = mixer.clipAction(object.animations[0]);
                }

                scene.add(model);
            }, undefined, function (error) {
                console.error("FBX yuklashda xatolik:", error);
            });

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));

            // Sichqoncha orqali kamerani aylantirish
            let isMouseDown = false;
            window.addEventListener('mousedown', () => isMouseDown = true);
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('mousemove', (e) => {
                if (isMouseDown) {
                    cameraAngle -= e.movementX * 0.005;
                }
            });

            animate();
        }

        function handleKey(event, isPressed) {
            const key = event.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = isPressed;
            }
        }

        function updateMovement(delta) {
            if (!model) return;

            const moveSpeed = 4.0 * delta;
            let moving = false;

            // Personaj harakati
            if (keys.w) {
                model.position.z -= moveSpeed;
                model.rotation.y = Math.PI; // Oldinga qarash
                moving = true;
            }
            if (keys.s) {
                model.position.z += moveSpeed;
                model.rotation.y = 0; // Orqaga qarash
                moving = true;
            }
            if (keys.a) {
                model.position.x -= moveSpeed;
                model.rotation.y = -Math.PI / 2; // Chapga
                moving = true;
            }
            if (keys.d) {
                model.position.x += moveSpeed;
                model.rotation.y = Math.PI / 2; // O'ngga
                moving = true;
            }

            // Animatsiyani boshqarish
            if (walkAction) {
                if (moving) {
                    if (!walkAction.isRunning()) walkAction.play();
                } else {
                    if (walkAction.isRunning()) walkAction.stop();
                }
            }

            // KAMERA HARAKATI (Har doim personaj ortida turadi - haqiqiy 3rd person)
            camera.position.x = model.position.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = model.position.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = model.position.y + cameraHeight;

            // Kamera doimo personajning boshiga qaraydi
            camera.lookAt(model.position.x, model.position.y + 1.2, model.position.z);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);
            updateMovement(delta);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
