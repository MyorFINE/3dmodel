
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Character World</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}
canvas{display:block}
#loading{position:fixed;inset:0;background:#101923;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;z-index:10}
#spinner{width:42px;height:42px;border:4px solid #ffffff30;border-top-color:#42baff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hud{position:fixed;top:12px;left:14px;color:white;font-size:12px;line-height:1.8;text-shadow:0 2px 4px #000;pointer-events:none}
#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#101820dd;color:white;padding:10px 14px;border-radius:8px;font-size:12px;white-space:nowrap}
#error{display:none;position:fixed;z-index:20;bottom:10px;left:10px;right:10px;background:#400;color:white;padding:12px;white-space:pre-wrap;font-size:12px}
</style>
</head>

<body>

<div id="loading">
 <div id="spinner"></div>
 <div id="loadText">3D modellar yuklanmoqda...</div>
 <div id="loadError"></div>
</div>

<div id="hud">
 <b>CHARACTER WORLD</b><br>
 Kamera: FREE CAMERA<br>
 Personaj: <span id="status">Yuklanmoqda</span><br>
 FPS: <span id="fps">0</span>
</div>

<div id="help">
 WASD — Kamera | Sichqoncha — Aylantirish | Space — Yuqoriga | Ctrl — Pastga | Shift — Tezroq | Scroll — Zoom
</div>

<div id="error"></div>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

/* =========================================
   FILES
========================================= */

const BASE = new URL("./",location.href);

const FILES = {
 idle:"idle.fbx",
 walk:"standartwalk.fbx",
 textures:{
  suit:"male_casualsuit03_diffuse.png",
  normal:"male_casualsuit03_normal.png",
  body:"middleage_lightskinned_male_diffuse2.png",
  shoes:"shoes05_diffuse.png",
  hair:"short02_diffuse.png",
  eyes:"brown_eye.png",
  eyebrow:"eyebrow004.png",
  eyelashes:"eyelashes01.png",
  teeth:"teeth.png",
  tongue:"tongue01_diffuse.png"
 }
};

/* =========================================
   SETTINGS
========================================= */

const SETTINGS={
 characterHeight:1.75,
 walkSpeed:2,
 runSpeed:4.5,
 jumpSpeed:5.5,
 gravity:15,
 cameraSpeed:8,
 cameraFastSpeed:18
};

/* =========================================
   UI
========================================= */

const $=id=>document.getElementById(id);

function loading(text){
 $("loadText").textContent=text;
}

function showError(error){
 console.error(error);
 $("spinner").style.display="none";
 $("loadText").textContent="Xatolik yuz berdi";
 $("loadError").textContent=error.message||String(error);
 $("error").style.display="block";
 $("error").textContent=error.stack||String(error);
}

/* =========================================
   THREE SCENE
========================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9db9cd);
scene.fog=new THREE.Fog(0x9db9cd,100,400);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,2000
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();
const fbxLoader=new FBXLoader();

let character=null;
let mixer=null;
let idleAction=null;
let walkAction=null;
let currentAction=null;
let ready=false;

const textures={};
const keys={};

/* =========================================
   FREE CAMERA
   CAMERA PERSONAJGA BOG'LANMAGAN
========================================= */

const freeCamera={
 position:new THREE.Vector3(0,3,9),
 yaw:0,
 pitch:-0.15,
 sensitivity:0.002,
 speed:8
};

function updateFreeCamera(delta){

 const fast=keys.ShiftLeft||keys.ShiftRight;
 const speed=fast?SETTINGS.cameraFastSpeed:SETTINGS.cameraSpeed;

 const forward=new THREE.Vector3(
  -Math.sin(freeCamera.yaw)*Math.cos(freeCamera.pitch),
  Math.sin(freeCamera.pitch),
  -Math.cos(freeCamera.yaw)*Math.cos(freeCamera.pitch)
 );

 const right=new THREE.Vector3(
  Math.cos(freeCamera.yaw),
  0,
  -Math.sin(freeCamera.yaw)
 );

 if(keys.KeyW||keys.ArrowUp)
  freeCamera.position.addScaledVector(forward,speed*delta);

 if(keys.KeyS||keys.ArrowDown)
  freeCamera.position.addScaledVector(forward,-speed*delta);

 if(keys.KeyA||keys.ArrowLeft)
  freeCamera.position.addScaledVector(right,-speed*delta);

 if(keys.KeyD||keys.ArrowRight)
  freeCamera.position.addScaledVector(right,speed*delta);

 if(keys.Space)
  freeCamera.position.y+=speed*delta;

 if(keys.ControlLeft||keys.ControlRight)
  freeCamera.position.y-=speed*delta;

 camera.position.copy(freeCamera.position);

 camera.lookAt(
  freeCamera.position.x+forward.x,
  freeCamera.position.y+forward.y,
  freeCamera.position.z+forward.z
 );
}

/* =========================================
   CAMERA INPUT
========================================= */

renderer.domElement.addEventListener("click",()=>{
 if(ready&&document.pointerLockElement!==renderer.domElement){
  renderer.domElement.requestPointerLock();
 }
});

document.addEventListener("mousemove",event=>{
 if(document.pointerLockElement!==renderer.domElement)return;

 freeCamera.yaw-=event.movementX*freeCamera.sensitivity;
 freeCamera.pitch-=event.movementY*freeCamera.sensitivity;

 freeCamera.pitch=THREE.MathUtils.clamp(
  freeCamera.pitch,-1.5,1.5
 );
});

renderer.domElement.addEventListener("wheel",event=>{
 const direction=new THREE.Vector3(
  -Math.sin(freeCamera.yaw)*Math.cos(freeCamera.pitch),
  Math.sin(freeCamera.pitch),
  -Math.cos(freeCamera.yaw)*Math.cos(freeCamera.pitch)
 );

 freeCamera.position.addScaledVector(direction,event.deltaY*0.012);
});

window.addEventListener("keydown",event=>{
 keys[event.code]=true;

 if(event.code==="Space"&&ready&&character&&character.userData.grounded){
  character.userData.velocity=SETTINGS.jumpSpeed;
  character.userData.grounded=false;
 }

});

window.addEventListener("keyup",event=>{
 keys[event.code]=false;
});

window.addEventListener("blur",()=>{
 Object.keys(keys).forEach(key=>keys[key]=false);
});

/* =========================================
   WORLD
========================================= */

function createWorld(){

 const hemi=new THREE.HemisphereLight(0xeaf5ff,0x5e604b,2);
 scene.add(hemi);

 const ambient=new THREE.AmbientLight(0xffffff,0.65);
 scene.add(ambient);

 const sun=new THREE.DirectionalLight(0xfff0d8,3);
 sun.position.set(-25,45,25);
 sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);
 sun.shadow.camera.left=-60;
 sun.shadow.camera.right=60;
 sun.shadow.camera.top=60;
 sun.shadow.camera.bottom=-60;
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(10000,10000),
  new THREE.MeshStandardMaterial({
   color:0x647b58,
   roughness:1
  })
 );

 ground.rotation.x=-Math.PI/2;
 ground.position.y=-0.05;
 ground.receiveShadow=true;
 scene.add(ground);

 const grid=new THREE.GridHelper(200,100,0x455b42,0x71816a);
 grid.material.transparent=true;
 grid.material.opacity=0.12;
 scene.add(grid);

 // Character spawn marker
 const marker=new THREE.Mesh(
  new THREE.RingGeometry(0.65,0.72,48),
  new THREE.MeshBasicMaterial({
   color:0x4ec7ff,
   side:THREE.DoubleSide
  })
 );

 marker.rotation.x=-Math.PI/2;
 marker.position.y=0.01;
 scene.add(marker);
}

/* =========================================
   TEXTURE LOADER
========================================= */

async function loadTexture(name,file){

 try{
  const url=new URL(file,BASE).href;

  const response=await fetch(url,{cache:"no-store"});

  if(!response.ok){
   throw new Error("HTTP "+response.status+": "+file);
  }

  const blob=await response.blob();
  const bitmap=await createImageBitmap(blob);

  const texture=new THREE.Texture(bitmap);
  texture.flipY=false;
  texture.colorSpace=name==="normal"
   ?THREE.NoColorSpace
   :THREE.SRGBColorSpace;

  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  texture.needsUpdate=true;

  textures[name]=texture;

  console.log("Texture loaded:",name);
  return texture;

 }catch(error){
  console.warn("Texture yuklanmadi:",name,error);
  return null;
 }
}

async function loadAllTextures(){

 const entries=Object.entries(FILES.textures);

 await Promise.all(
  entries.map(([name,file])=>loadTexture(name,file))
 );
}

/* =========================================
   MATERIAL DETECTION
========================================= */

function detectTexture(meshName,materialName){

 const name=((meshName||"")+" "+(materialName||"")).toLowerCase();

 if(/shoe|boot|footwear/.test(name))return "shoes";
 if(/hair|hairstyle/.test(name))return "hair";
 if(/eyebrow|brow/.test(name))return "eyebrow";
 if(/eyelash|lash/.test(name))return "eyelashes";
 if(/teeth|tooth/.test(name))return "teeth";
 if(/tongue/.test(name))return "tongue";
 if(/eye|iris|pupil/.test(name))return "eyes";
 if(/suit|jacket|shirt|trouser|pants|cloth|tie/.test(name))return "suit";
 if(/body|skin|face|head|arm|leg|hand|neck|torso/.test(name))return "body";

 return null;
}

function applyMaterials(model){

 model.traverse(object=>{

  if(!object.isMesh)return;

  object.castShadow=true;
  object.receiveShadow=true;

  const materials=Array.isArray(object.material)
   ?object.material
   :[object.material];

  materials.forEach(material=>{

   const textureName=detectTexture(object.name,material.name);

   material.color.set(0xffffff);

   if(textureName&&textures[textureName]){
    material.map=textures[textureName];
   }

   if(textureName==="suit"&&textures.normal){
    material.normalMap=textures.normal;
    material.normalScale.set(0.4,0.4);
   }

   material.needsUpdate=true;
  });

 });
}

/* =========================================
   CHARACTER CREATION
========================================= */

function createCharacter(fbx){

 const box=new THREE.Box3().setFromObject(fbx);
 const size=new THREE.Vector3();
 box.getSize(size);

 if(size.y<=0){
  throw new Error("FBX personaj o'lchamini aniqlab bo'lmadi.");
 }

 const scale=SETTINGS.characterHeight/size.y;
 fbx.scale.setScalar(scale);

 const scaledBox=new THREE.Box3().setFromObject(fbx);

 // Modelni polga joylashtirish
 fbx.position.y-=scaledBox.min.y;

 applyMaterials(fbx);

 const root=new THREE.Group();
 root.name="PlayerCharacter";

 root.add(fbx);

 // Personaj kamera joyidan mustaqil spawn bo'ladi.
 root.position.set(0,0,0);
 root.rotation.set(0,Math.PI,0);

 root.userData.velocity=0;
 root.userData.grounded=true;

 scene.add(root);

 console.log("Character created:",size,scale);

 return root;
}

/* =========================================
   ANIMATION SETUP
========================================= */

function makeWalkClip(source){

 const clip=source.clone();

 clip.tracks.forEach(track=>{

  if(track.name.toLowerCase().includes("mixamorighips.position")){

   const values=track.values;

   if(values.length>=3){
    const x=values[0];
    const z=values[2];

    for(let i=0;i<values.length;i+=3){
     values[i]=x;
     values[i+2]=z;
    }
   }
  }

 });

 return clip;
}

function setupAnimations(idleFBX,walkFBX){

 if(!idleFBX.animations.length)
  throw new Error("idle.fbx ichida animatsiya topilmadi.");

 if(!walkFBX.animations.length)
  throw new Error("standartwalk.fbx ichida animatsiya topilmadi.");

 const idleClip=idleFBX.animations[0].clone();
 const walkClip=makeWalkClip(walkFBX.animations[0]);

 mixer=new THREE.AnimationMixer(character);

 idleAction=mixer.clipAction(idleClip);
 walkAction=mixer.clipAction(walkClip);

 idleAction.play();
 walkAction.play();

 walkAction.setEffectiveWeight(0);

 currentAction=idleAction;
}

/* =========================================
   ANIMATION SWITCH
========================================= */

function setAnimation(moving){

 if(!idleAction||!walkAction)return;

 const next=moving?walkAction:idleAction;

 if(next===currentAction)return;

 next.reset();
 next.enabled=true;
 next.setEffectiveWeight(1);

 currentAction.crossFadeTo(next,0.2,false);

 next.play();
 currentAction=next;
}

/* =========================================
   CHARACTER MOVEMENT
========================================= */

function updateCharacter(delta){

 if(!character||!ready)return;

 let forward=0;
 let side=0;

 if(keys.KeyW)forward++;
 if(keys.KeyS)forward--;
 if(keys.KeyA)side--;
 if(keys.KeyD)side++;

 const moving=forward!==0||side!==0;

 if(moving){

  const input=new THREE.Vector2(side,forward).normalize();

  // Personaj harakati kameraga emas,
  // o'zining dunyo koordinatasiga asoslangan.
  const direction=new THREE.Vector3(
   input.x,
   0,
   -input.y
  );

  const angle=Math.atan2(direction.x,direction.z);

  let difference=Math.atan2(
   Math.sin(angle-character.rotation.y),
   Math.cos(angle-character.rotation.y)
  );

  character.rotation.y+=difference*(1-Math.exp(-10*delta));

  const running=keys.ShiftLeft||keys.ShiftRight;
  const speed=running?SETTINGS.runSpeed:SETTINGS.walkSpeed;

  character.position.addScaledVector(direction,speed*delta);
 }

 if(!character.userData.grounded){

  character.userData.velocity-=SETTINGS.gravity*delta;
  character.position.y+=character.userData.velocity*delta;

  if(character.position.y<=0){
   character.position.y=0;
   character.userData.velocity=0;
   character.userData.grounded=true;
  }
 }

 setAnimation(moving);

 $("status").textContent=moving
  ?(keys.ShiftLeft||keys.ShiftRight?"Yugurmoqda":"Yurmoqda")
  :"Idle";
}

/* =========================================
   LOAD ASSETS
========================================= */

async function loadGame(){

 loading("Teksturalar yuklanmoqda...");
 await loadAllTextures();

 loading("Idle FBX yuklanmoqda...");
 const idleFBX=await fbxLoader.loadAsync(
  new URL(FILES.idle,BASE).href
 );

 loading("Walk FBX yuklanmoqda...");
 const walkFBX=await fbxLoader.loadAsync(
  new URL(FILES.walk,BASE).href
 );

 loading("Personaj yaratilmoqda...");

 // Idle FBX ichidagi modelni personaj sifatida ishlatamiz.
 character=createCharacter(idleFBX);

 // Animation mixer
 setupAnimations(idleFBX,walkFBX);

 ready=true;

 $("loading").style.display="none";

 console.log("GAME READY");
}

/* =========================================
   FPS
========================================= */

let fpsFrames=0;
let fpsTime=0;

function updateFPS(delta){

 fpsFrames++;
 fpsTime+=delta;

 if(fpsTime>=0.5){
  $("fps").textContent=Math.round(fpsFrames/fpsTime);
  fpsFrames=0;
  fpsTime=0;
 }
}

/* =========================================
   RENDER LOOP
========================================= */

function animate(){

 requestAnimationFrame(animate);

 const delta=Math.min(clock.getDelta(),0.05);

 updateFreeCamera(delta);

 if(ready){
  updateCharacter(delta);

  if(mixer)mixer.update(delta);
 }

 updateFPS(delta);

 renderer.render(scene,camera);
}

/* =========================================
   RESIZE
========================================= */

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

/* =========================================
   START
========================================= */

async function start(){

 createWorld();

 // Kamera mustaqil boshlang'ich pozitsiyasi.
 freeCamera.position.set(0,3,9);
 freeCamera.yaw=0;
 freeCamera.pitch=-0.15;

 camera.position.copy(freeCamera.position);

 const forward=new THREE.Vector3(0,0,-1);
 camera.lookAt(
  freeCamera.position.x+forward.x,
  freeCamera.position.y+forward.y,
  freeCamera.position.z+forward.z
 );

 animate();

 try{
  await loadGame();
 }catch(error){
  showError(error);
 }

}

start();

</script>
</body>
</html>
