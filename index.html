<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gaz Plita Interaktiv Preview (GLB)</title>
    <style>
        :root {
            --bg-dark: #0d0f12;
            --panel-bg: rgba(20, 24, 30, 0.85);
            --border-color: #2a313c;
            --accent: #00f0ff;
            --accent-fire: #ff5500;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Boshqaruv paneli */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: calc(100vh - 40px);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        #ui-panel::-webkit-scrollbar {
            width: 6px;
        }
        #ui-panel::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* Fayl yuklash tugmasi */
        .file-upload {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background: #1e242d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-fire.active {
            background: rgba(255, 85, 0, 0.2);
            border-color: var(--accent-fire);
            color: #ff884d;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
        }

        input[type="file"] {
            display: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Slayder va qismlar ro'yxati */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        select, input[type="range"] {
            width: 100%;
            background: #161a20;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }

        input[type="range"] {
            padding: 0;
            accent-color: var(--accent);
        }

        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            z-index: 10;
        }

        .status-bar span {
            color: var(--accent);
            font-weight: 600;
        }
    </style>

    <!-- Three.js Import Map (CDN orqali to'g'ridan-to'g'ri ishlaydi) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="status-bar" id="status-text">
        Holat: <span>Model kutilmoqda (model.glb yoki fayl tanlang)</span>
    </div>

    <div id="ui-panel">
        <h2>3D Plita Boshqaruvi</h2>

        <!-- 1. GLB Yuklash -->
        <div class="file-upload">
            <div class="section-title">1. Modelni yuklash</div>
            <label for="glb-input" class="btn">📁 Lokal .GLB fayl tanlash</label>
            <input type="file" id="glb-input" accept=".glb,.gltf">
        </div>

        <!-- 2. Duxovka eshigi animatsiyasi -->
        <div>
            <div class="section-title">2. Duxovka Eshigi</div>
            <div class="control-group">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Eshik qismini tanlang:</label>
                <select id="door-select">
                    <option value="">Avtomatik qidirish...</option>
                </select>
                <button id="toggle-door-btn" class="btn" style="margin-top: 6px;">🚪 Eshikni Ochish / Yopish</button>
            </div>
        </div>

        <!-- 3. Gaz Konforkalari (Olov) -->
        <div>
            <div class="section-title">3. Gaz Konforkalari (Olov)</div>
            <div class="grid-2">
                <button class="btn btn-fire" data-burner="0">🔥 Chap Old</button>
                <button class="btn btn-fire" data-burner="1">🔥 O'ng Old</button>
                <button class="btn btn-fire" data-burner="2">🔥 Chap Orqa</button>
                <button class="btn btn-fire" data-burner="3">🔥 O'ng Orqa</button>
            </div>
        </div>

        <!-- 4. Qismlar Inspektor & Test -->
        <div>
            <div class="section-title">4. Qismlarni Tekshirish (Inspector)</div>
            <div class="control-group">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Istalgan mesh/qismni tanlang:</label>
                <select id="part-select">
                    <option value="">Model yuklanmagan</option>
                </select>
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 4px;">
                    <span>X o'qi bo'yicha burish:</span>
                    <span id="rot-val">0°</span>
                </div>
                <input type="range" id="rot-slider" min="-120" max="120" value="0">
                <button id="reset-part-btn" class="btn" style="padding: 6px; font-size: 0.8rem;">Holatni tiklash</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. SAHNA VA RENDERER SOZLAMALARI ---
        const container = document.getElementById('canvas-container');
        const statusText = document.querySelector('#status-text span');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0f12);
        scene.fog = new THREE.FogExp2(0x0d0f12, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.2, 2.0, 2.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.5, 0);

        // --- 2. YORITISH (LIGHTING) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(4, 7, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x00f0ff, 0.6);
        rimLight.position.set(-4, 3, -4);
        scene.add(rimLight);

        // Pol (Grid)
        const gridHelper = new THREE.GridHelper(10, 20, 0x2a313c, 0x161a20);
        scene.add(gridHelper);

        // --- 3. OLOV EFFEKTI (PROCEDURAL FLAME GENERATOR) ---
        const flames = [];
        // Standart gaz plita konforkalari koordinatalari (model yuklanganda moslashtiriladi)
        const burnerOffsets = [
            { x: -0.22, y: 0.92, z:  0.20 }, // Chap Old
            { x:  0.22, y: 0.92, z:  0.20 }, // O'ng Old
            { x: -0.22, y: 0.92, z: -0.18 }, // Chap Orqa
            { x:  0.22, y: 0.92, z: -0.18 }  // O'ng Orqa
        ];

        function createGasFlame(pos) {
            const group = new THREE.Group();
            group.position.set(pos.x, pos.y, pos.z);

            // Moviy gaz halqasi
            const ringGeo = new THREE.TorusGeometry(0.065, 0.008, 12, 32);
            ringGeo.rotateX(Math.PI / 2);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00aaff,
                transparent: true,
                opacity: 0.9
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            group.add(ringMesh);

            // Ichki yorqin olov toji
            const innerGeo = new THREE.ConeGeometry(0.075, 0.035, 24, 1, true);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0x44ddff,
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide
            });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            innerMesh.position.y = 0.015;
            group.add(innerMesh);

            // Olovdan tushadigan yorug'lik
            const pointLight = new THREE.PointLight(0x0099ff, 1.5, 0.8);
            pointLight.position.y = 0.05;
            group.add(pointLight);

            group.visible = false;
            scene.add(group);
            return { group, ringMesh, innerMesh, pointLight, active: false };
        }

        burnerOffsets.forEach(pos => flames.push(createGasFlame(pos)));

        // --- 4. MODEL YUKLASH VA TAHLIL QILISH ---
        let currentModel = null;
        const modelParts = {}; // Barcha qismlar ro'yxati
        const initialRotations = {}; // Boshlang'ich burchaklar
        let doorOpen = false;
        let targetDoorAngle = 0;

        const loader = new GLTFLoader();
        const doorSelect = document.getElementById('door-select');
        const partSelect = document.getElementById('part-select');

        function loadGLBFromURL(url, fileName = "model.glb") {
            statusText.textContent = `${fileName} yuklanmoqda...`;

            loader.load(url, (gltf) => {
                if (currentModel) scene.remove(currentModel);

                currentModel = gltf.scene;

                // Model o'lchamini normallashtirish (markazga va polga qo'yish)
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 1.2 / maxDim; // Balandligi taxminan 1.2 metr bo'ladi
                currentModel.scale.setScalar(scale);

                // Qayta o'lchab polga (Y=0) tekislash
                const scaledBox = new THREE.Box3().setFromObject(currentModel);
                const center = scaledBox.getCenter(new THREE.Vector3());
                currentModel.position.x -= center.x;
                currentModel.position.z -= center.z;
                currentModel.position.y -= scaledBox.min.y;

                // Olovlarni plita ustki qismiga (top Y) moslashtirish
                const finalBox = new THREE.Box3().setFromObject(currentModel);
                const topY = finalBox.max.y - 0.03;
                const widthX = (finalBox.max.x - finalBox.min.x) * 0.24;
                const depthZ = (finalBox.max.z - finalBox.min.z) * 0.22;

                const autoPositions = [
                    { x: -widthX, y: topY, z:  depthZ },
                    { x:  widthX, y: topY, z:  depthZ },
                    { x: -widthX, y: topY, z: -depthZ },
                    { x:  widthX, y: topY, z: -depthZ }
                ];

                flames.forEach((f, idx) => {
                    f.group.position.set(autoPositions[idx].x, autoPositions[idx].y, autoPositions[idx].z);
                });

                // Ro'yxatlarni tozalash va qismlarni yig'ish
                doorSelect.innerHTML = '';
                partSelect.innerHTML = '';
                Object.keys(modelParts).forEach(k => delete modelParts[k]);

                let partIndex = 0;
                let autoDetectedDoor = "";

                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }

                    if (child.isMesh || child.isGroup) {
                        const name = child.name || `Qism_${partIndex++}`;
                        if (name === "Scene") return;

                        modelParts[name] = child;
                        initialRotations[name] = child.rotation.clone();

                        // Select menyularga qo'shish
                        const opt1 = new Option(name, name);
                        const opt2 = new Option(name, name);
                        doorSelect.add(opt1);
                        partSelect.add(opt2);

                        // Eshik nomini avtomatik taxmin qilish
                        const lower = name.toLowerCase();
                        if (lower.includes('door') || lower.includes('glass') || lower.includes('eshik') || lower.includes('oven')) {
                            autoDetectedDoor = name;
                        }
                    }
                });

                if (autoDetectedDoor) {
                    doorSelect.value = autoDetectedDoor;
                }

                scene.add(currentModel);
                statusText.textContent = `${fileName} muvaffaqiyatli yuklandi! (${Object.keys(modelParts).length} ta qism)`;
            },
            undefined,
            (error) => {
                console.warn("Standart model.glb topilmadi:", error);
                statusText.textContent = `Tayyor. Yuqoridan .GLB fayl tanlang yoki repoga 'model.glb' qo'shing.`;
            });
        }

        // GitHub Pages-ga joylaganda shu papkadagi 'model.glb' ni avtomatik yuklashga urinadi
        loadGLBFromURL('./model.glb', 'model.glb');

        // Lokal fayl tanlanganda yuklash
        document.getElementById('glb-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            loadGLBFromURL(url, file.name);
        });

        // --- 5. INTERAKTIV BOSHQARUV HODISALARI ---

        // Duxovka eshigini ochish/yopish
        document.getElementById('toggle-door-btn').addEventListener('click', (e) => {
            doorOpen = !doorOpen;
            targetDoorAngle = doorOpen ? Math.PI * 0.45 : 0; // ~80 gradus pastga ochiladi
            e.target.classList.toggle('active', doorOpen);
        });

        // Gaz konforkalarini yoqish/o'chirish
        document.querySelectorAll('.btn-fire').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.getAttribute('data-burner'));
                const flame = flames[idx];
                flame.active = !flame.active;
                flame.group.visible = flame.active;
                btn.classList.toggle('active', flame.active);
            });
        });

        // Inspector: Qismlarni qo'lda burish
        const rotSlider = document.getElementById('rot-slider');
        const rotVal = document.getElementById('rot-val');

        partSelect.addEventListener('change', () => {
            const part = modelParts[partSelect.value];
            const initRot = initialRotations[partSelect.value];
            if (part && initRot) {
                const deg = Math.round(THREE.MathUtils.radToDeg(part.rotation.x - initRot.x));
                rotSlider.value = deg;
                rotVal.textContent = `${deg}°`;
            }
        });

        rotSlider.addEventListener('input', (e) => {
            const deg = parseFloat(e.target.value);
            rotVal.textContent = `${deg}°`;
            const name = partSelect.value;
            const part = modelParts[name];
            const initRot = initialRotations[name];

            if (part && initRot) {
                part.rotation.x = initRot.x + THREE.MathUtils.degToRad(deg);
            }
        });

        document.getElementById('reset-part-btn').addEventListener('click', () => {
            const name = partSelect.value;
            if (modelParts[name] && initialRotations[name]) {
                modelParts[name].rotation.copy(initialRotations[name]);
                rotSlider.value = 0;
                rotVal.textContent = "0°";
            }
        });

        // Ekran o'lchami o'zgarganda moslashish
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 6. ANIMATSIYA SIKLI ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // 1. Eshikning silliq ochilish animatsiyasi
            const selectedDoorName = doorSelect.value;
            if (selectedDoorName && modelParts[selectedDoorName]) {
                const doorObj = modelParts[selectedDoorName];
                const initX = initialRotations[selectedDoorName]?.x || 0;
                const desiredX = initX + targetDoorAngle;
                doorObj.rotation.x += (desiredX - doorObj.rotation.x) * 0.1;
            }

            // 2. Gaz olovining jonli titrash animatsiyasi
            flames.forEach((f, i) => {
                if (f.active) {
                    const flicker = 1 + Math.sin(elapsed * 25 + i) * 0.08 + Math.cos(elapsed * 40) * 0.04;
                    f.innerMesh.scale.set(1, flicker, 1);
                    f.pointLight.intensity = 1.2 + Math.sin(elapsed * 30 + i) * 0.3;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
