
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Third Person Character</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#89949c;font-family:Arial}
canvas{display:block}
#loading{
 position:fixed;inset:0;background:#111;color:white;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:12px;z-index:10
}
#loading small{color:#aaa}
#start{
 position:fixed;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:#0007;z-index:5
}
#start button{
 background:#202020;color:white;border:1px solid #777;
 padding:17px 35px;border-radius:7px;font-size:15px;
 cursor:pointer
}
#info{
 position:fixed;top:20px;left:20px;
 background:#0009;color:white;padding:14px;
 border-radius:8px;font-size:13px;line-height:1.9;
 pointer-events:none
}
#status{
 position:fixed;right:20px;top:20px;
 background:#0009;color:white;padding:12px 17px;
 border-radius:7px;font-size:13px
}
#crosshair{
 position:fixed;top:50%;left:50%;color:white;
 transform:translate(-50%,-50%);opacity:.5;
 pointer-events:none
}
</style>
</head>
<body>

<div id="loading">
 <h2>CHARACTER LOADING</h2>
 <small id="loadText">Model yuklanmoqda...</small>
</div>

<div id="start">
 <button id="startBtn">O'YINNI BOSHLASH</button>
</div>

<div id="info">
 <b>THIRD PERSON</b><br>
 W A S D — Harakat<br>
 SHIFT — Yugurish<br>
 MOUSE — Kamera<br>
 ESC — Sichqonchani bo'shatish
</div>

<div id="status">IDLE</div>
<div id="crosshair">+</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

// ===================================
// SCENE
// ===================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9daab5);
scene.fog=new THREE.Fog(0x9daab5,35,120);

const camera=new THREE.PerspectiveCamera(
 55,innerWidth/innerHeight,0.1,500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

// ===================================
// LIGHTING
// ===================================

scene.add(new THREE.HemisphereLight(
 0xffffff,0x62616a,2
));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-10,18,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-20;
sun.shadow.camera.right=20;
sun.shadow.camera.top=20;
sun.shadow.camera.bottom=-20;
scene.add(sun);

// ===================================
// GROUND
// ===================================

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({
  color:0x68745f,
  roughness:1
 })
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(500,100,0x777777,0x999999);
grid.position.y=.02;
grid.material.transparent=true;
grid.material.opacity=.12;
scene.add(grid);

// ===================================
// CHARACTER
// ===================================

const root=new THREE.Group();
scene.add(root);

const loader=new FBXLoader();
const texLoader=new THREE.TextureLoader();

const textures={};

const textureFiles={
 suit:'male_casualsuit03_diffuse.png',
 normal:'male_casualsuit03_normal.png',
 body:'middleage_lightskinned_male_diffuse2.png',
 hair:'short02_diffuse.png',
 shoes:'shoes05_diffuse.png',
 eyes:'brown_eye.png',
 eyebrow:'eyebrow004.png',
 eyelashes:'eyelashes01.png',
 teeth:'teeth.png',
 tongue:'tongue01_diffuse.png'
};

function loadTexture(file){
 const t=texLoader.load(file);
 t.colorSpace=THREE.SRGBColorSpace;
 t.flipY=false;
 return t;
}

for(const [key,file] of Object.entries(textureFiles)){
 textures[key]=loadTexture(file);
}

let character=null;
let mixer=null;
let idleAction=null;
let walkAction=null;
let activeAction=null;

let modelHeight=1.75;

// ===================================
// MATERIAL ASSIGNMENT
// ===================================

function assignTextures(model){

 model.traverse(obj=>{

  if(!obj.isMesh)return;

  obj.castShadow=true;
  obj.receiveShadow=true;

  const mats=Array.isArray(obj.material)
   ?obj.material:[obj.material];

  mats.forEach(mat=>{

   if(!mat)return;

   const name=(
    obj.name+' '+(mat.name||'')
   ).toLowerCase();

   if(/shoe|boot|footwear/.test(name)){
    mat.map=textures.shoes;
   }
   else if(/hair/.test(name)){
    mat.map=textures.hair;
   }
   else if(/eyebrow|brow/.test(name)){
    mat.map=textures.eyebrow;
   }
   else if(/eyelash|lash/.test(name)){
    mat.map=textures.eyelashes;
   }
   else if(/eye/.test(name)){
    mat.map=textures.eyes;
   }
   else if(/teeth/.test(name)){
    mat.map=textures.teeth;
   }
   else if(/tongue/.test(name)){
    mat.map=textures.tongue;
   }
   else if(/skin|body|face|head|arm|hand|neck|leg/.test(name)){
    mat.map=textures.body;
   }
   else if(/suit|shirt|coat|jacket|trouser|pants|clothes/.test(name)){
    mat.map=textures.suit;
    mat.normalMap=textures.normal;
   }

   mat.side=THREE.DoubleSide;
   mat.needsUpdate=true;
  });

 });
}

// ===================================
// NORMALIZE MODEL
// ===================================

function prepareCharacter(model){

 assignTextures(model);

 const initialBox=new THREE.Box3().setFromObject(model);
 const initialSize=initialBox.getSize(new THREE.Vector3());

 const height=initialSize.y;

 if(height<=0){
  throw new Error('FBX model balandligi aniqlanmadi');
 }

 // Realistic human height
 const scale=1.75/height;

 model.scale.setScalar(scale);

 // Center model horizontally and put feet on ground
 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());

 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=box.min.y;

 root.add(model);

 character=model;
 modelHeight=1.75;

 console.log('Character dimensions:',initialSize);
 console.log('Character scale:',scale);
}

// ===================================
// ANIMATION
// ===================================

function switchAnimation(action,fade=.2){

 if(!action || activeAction===action)return;

 if(activeAction){
  activeAction.fadeOut(fade);
 }

 action.reset();
 action.fadeIn(fade);
 action.play();

 activeAction=action;
}

// ===================================
// LOAD CHARACTER
// ===================================

async function loadCharacter(){

 try{

  $('loadText').textContent='Idle FBX yuklanmoqda...';

  const idleModel=await loader.loadAsync('idle.fbx');

  prepareCharacter(idleModel);

  mixer=new THREE.AnimationMixer(character);

  if(idleModel.animations.length){
   idleAction=mixer.clipAction(idleModel.animations[0]);
   idleAction.play();
   activeAction=idleAction;
  }

  $('loadText').textContent='Walk animatsiyasi yuklanmoqda...';

  const walkModel=await loader.loadAsync('standartwalk.fbx');

  if(walkModel.animations.length){

   walkAction=mixer.clipAction(
    walkModel.animations[0]
   );

   console.log('Walk animation:',walkModel.animations[0]);
  }

  $('loading').style.display='none';

 }catch(e){

  console.error(e);
  $('loadText').textContent='Xatolik: '+e.message;

 }

}

function $(id){return document.getElementById(id)}

await loadCharacter();

// ===================================
// CONTROLS
// ===================================

const keys={};

addEventListener('keydown',e=>{
 keys[e.code]=true;
});

addEventListener('keyup',e=>{
 keys[e.code]=false;
});

addEventListener('blur',()=>{
 for(const k in keys)keys[k]=false;
});

let started=false;

$('startBtn').onclick=()=>{
 started=true;
 $('start').style.display='none';
 renderer.domElement.requestPointerLock();
};

renderer.domElement.addEventListener('click',()=>{
 if(started && !document.pointerLockElement){
  renderer.domElement.requestPointerLock();
 }
});

// ===================================
// CAMERA
// ===================================

// Camera follows character from behind
let yaw=0;
let pitch=0.08;

const CAMERA_DISTANCE=5.2;
const CAMERA_HEIGHT=0.25;

// Aim point: upper body / chest
const TARGET_HEIGHT=1.25;

addEventListener('mousemove',e=>{

 if(!document.pointerLockElement)return;

 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.0025;

 pitch=THREE.MathUtils.clamp(pitch,-.25,.55);

});

// ===================================
// MOVEMENT
// ===================================

const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const move=new THREE.Vector3();

const cameraPos=new THREE.Vector3();
const lookTarget=new THREE.Vector3();

const clock=new THREE.Clock();

const walkSpeed=2.6;
const runSpeed=5.0;
const turnSpeed=10;

function smoothAngle(current,target,amount){

 let d=Math.atan2(
  Math.sin(target-current),
  Math.cos(target-current)
 );

 return current+d*amount;
}

// ===================================
// MAIN LOOP
// ===================================

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 if(mixer)mixer.update(dt);

 if(character){

  let f=0;
  let s=0;

  if(keys.KeyW||keys.ArrowUp)f++;
  if(keys.KeyS||keys.ArrowDown)f--;
  if(keys.KeyA||keys.ArrowLeft)s--;
  if(keys.KeyD||keys.ArrowRight)s++;

  const moving=f!==0||s!==0;
  const running=keys.ShiftLeft||keys.ShiftRight;

  // Camera-relative direction
  forward.set(
   Math.sin(yaw),0,-Math.cos(yaw)
  );

  right.set(
   Math.cos(yaw),0,Math.sin(yaw)
  );

  move.set(0,0,0);
  move.addScaledVector(forward,f);
  move.addScaledVector(right,s);

  if(move.lengthSq()>0){

   move.normalize();

   const speed=running?runSpeed:walkSpeed;

   root.position.addScaledVector(move,speed*dt);

   // Rotate toward walking direction
   const targetRotation=Math.atan2(move.x,move.z);

   root.rotation.y=smoothAngle(
    root.rotation.y,
    targetRotation,
    Math.min(1,turnSpeed*dt)
   );

   if(walkAction){
    switchAnimation(walkAction,.2);
    walkAction.timeScale=running?1.35:1;
   }

  }else{

   if(idleAction){
    switchAnimation(idleAction,.2);
    idleAction.timeScale=1;
   }

  }

  // =================================
  // THIRD PERSON CAMERA
  // =================================

  const targetY=root.position.y+TARGET_HEIGHT;

  lookTarget.set(
   root.position.x,
   targetY,
   root.position.z
  );

  const horizontal=CAMERA_DISTANCE*Math.cos(pitch);

  cameraPos.set(
   root.position.x+Math.sin(yaw)*horizontal,
   targetY+CAMERA_HEIGHT+
    CAMERA_DISTANCE*Math.sin(pitch),
   root.position.z+Math.cos(yaw)*horizontal
  );

  // Smooth following
  camera.position.lerp(
   cameraPos,
   1-Math.pow(.0001,dt)
  );

  camera.lookAt(lookTarget);

  $('status').textContent=
   'HOLAT: '+(moving?(running?'RUNNING':'WALK'):'IDLE');
 }

 renderer.render(scene,camera);
}

animate();

// ===================================
// RESIZE
// ===================================

addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
