
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Third Person Controller</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#84919b;font-family:Arial,sans-serif}
canvas{display:block}

#loading{
 position:fixed;inset:0;background:#101318;color:white;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:14px;z-index:20
}
#loading small{color:#aab3bd}
#progress{
 width:220px;height:3px;background:#333;
 overflow:hidden;border-radius:5px
}
#progress span{
 display:block;width:35%;height:100%;
 background:#64b5f6;animation:load 1.2s infinite
}
@keyframes load{
 from{transform:translateX(-100%)}
 to{transform:translateX(400%)}
}

#start{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:#0007
}
#start button{
 background:#171b22;color:white;
 border:1px solid #64748b;border-radius:7px;
 padding:18px 38px;font-size:15px;
 cursor:pointer;letter-spacing:1px
}
#start button:hover{background:#303b4b}

#hud{
 position:fixed;left:20px;top:20px;
 background:#10151ccc;color:#fff;
 border:1px solid #ffffff20;
 border-radius:9px;padding:15px 18px;
 font-size:12px;line-height:2;
 pointer-events:none
}
#hud b{font-size:13px;letter-spacing:1px}
#status{
 position:fixed;right:20px;top:20px;
 background:#10151ccc;color:#fff;
 border:1px solid #ffffff20;
 padding:12px 18px;border-radius:8px;
 font-size:12px
}
#dot{
 display:inline-block;width:7px;height:7px;
 border-radius:50%;background:#52d68a;
 margin-right:7px
}
#centerDot{
 position:fixed;left:50%;top:50%;
 width:3px;height:3px;border-radius:50%;
 background:white;pointer-events:none
}
#bottom{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);
 color:#fff;background:#10151caa;
 padding:9px 15px;border-radius:6px;
 font-size:11px;pointer-events:none
}
</style>
</head>

<body>

<div id="loading">
 <h2>CHARACTER SYSTEM</h2>
 <div id="loadText">Model yuklanmoqda...</div>
 <div id="progress"><span></span></div>
</div>

<div id="start">
 <button id="startBtn">START GAME</button>
</div>

<div id="hud">
 <b>THIRD PERSON CONTROLLER</b><br>
 W A S D — Movement<br>
 SHIFT — Sprint<br>
 Mouse — Camera rotation<br>
 ESC — Unlock mouse
</div>

<div id="status"><span id="dot"></span>IDLE</div>
<div id="centerDot"></div>
<div id="bottom">WASD · SHIFT · MOUSE</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

// ==================================================
// CONFIGURATION
// ==================================================

const CONFIG={

 characterHeight:1.75,

 walkSpeed:2.0,
 sprintSpeed:4.0,

 acceleration:9.0,
 deceleration:13.0,

 rotationSpeed:12,

 cameraDistance:4.8,
 cameraHeight:0.18,
 cameraTargetHeight:1.05,

 cameraSensitivity:0.0025,
 cameraSmooth:10,

 minPitch:-0.30,
 maxPitch:0.60,

 animationFade:0.22,

 walkAnimationSpeed:1.0,
 sprintAnimationSpeed:1.35,

 shadows:true

};

// ==================================================
// SCENE
// ==================================================

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x9aa9b8);
scene.fog=new THREE.Fog(0x9aa9b8,40,140);

const camera=new THREE.PerspectiveCamera(
 55,innerWidth/innerHeight,0.1,500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled=CONFIG.shadows;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

document.body.appendChild(renderer.domElement);

// ==================================================
// LIGHTING
// ==================================================

const hemi=new THREE.HemisphereLight(
 0xffffff,0x555b50,2
);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-10,20,10);
sun.castShadow=true;

sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25;
sun.shadow.camera.right=25;
sun.shadow.camera.top=25;
sun.shadow.camera.bottom=-25;
sun.shadow.bias=-0.0002;

scene.add(sun);

// ==================================================
// ENVIRONMENT
// ==================================================

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({
  color:0x69755f,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(
 500,100,0x888888,0x999999
);

grid.position.y=0.015;
grid.material.transparent=true;
grid.material.opacity=0.12;
scene.add(grid);

// ==================================================
// TEXTURES
// ==================================================

const textureLoader=new THREE.TextureLoader();

const textures={};

const textureFiles={
 suit:'male_casualsuit03_diffuse.png',
 normal:'male_casualsuit03_normal.png',
 body:'middleage_lightskinned_male_diffuse2.png',
 hair:'short02_diffuse.png',
 shoes:'shoes05_diffuse.png',
 eyes:'brown_eye.png',
 eyebrow:'eyebrow004.png',
 eyelashes:'eyelashes01.png',
 teeth:'teeth.png',
 tongue:'tongue01_diffuse.png'
};

function loadTexture(file){

 const t=textureLoader.load(file);

 t.colorSpace=THREE.SRGBColorSpace;
 t.flipY=false;

 return t;
}

for(const [key,file] of Object.entries(textureFiles)){
 textures[key]=loadTexture(file);
}

// ==================================================
// CHARACTER SYSTEM
// ==================================================

const root=new THREE.Group();
scene.add(root);

const fbxLoader=new FBXLoader();

let character=null;
let mixer=null;

let idleAction=null;
let walkAction=null;

let activeAction=null;

let characterLoaded=false;

// ==================================================
// MATERIAL SYSTEM
// ==================================================

function assignMaterials(model){

 model.traverse(obj=>{

  if(!obj.isMesh)return;

  obj.castShadow=true;
  obj.receiveShadow=true;

  const materials=Array.isArray(obj.material)
   ?obj.material:[obj.material];

  materials.forEach(mat=>{

   if(!mat)return;

   const n=(
    obj.name+' '+(mat.name||'')
   ).toLowerCase();

   if(/shoe|boot|footwear/.test(n)){
    mat.map=textures.shoes;
   }
   else if(/eyebrow|brow/.test(n)){
    mat.map=textures.eyebrow;
   }
   else if(/eyelash|lash/.test(n)){
    mat.map=textures.eyelashes;
   }
   else if(/teeth/.test(n)){
    mat.map=textures.teeth;
   }
   else if(/tongue/.test(n)){
    mat.map=textures.tongue;
   }
   else if(/eye/.test(n)){
    mat.map=textures.eyes;
   }
   else if(/hair/.test(n)){
    mat.map=textures.hair;
   }
   else if(/skin|body|face|head|arm|hand|neck|leg/.test(n)){
    mat.map=textures.body;
   }
   else if(/suit|shirt|coat|jacket|trouser|pants|clothes/.test(n)){
    mat.map=textures.suit;
    mat.normalMap=textures.normal;
   }

   mat.side=THREE.DoubleSide;
   mat.needsUpdate=true;

  });

 });

}

// ==================================================
// MODEL NORMALIZATION
// ==================================================

function prepareModel(model){

 assignMaterials(model);

 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());

 if(size.y<=0){
  throw new Error('Model balandligi aniqlanmadi');
 }

 const scale=CONFIG.characterHeight/size.y;

 model.scale.setScalar(scale);

 const newBox=new THREE.Box3().setFromObject(model);
 const center=newBox.getCenter(new THREE.Vector3());

 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=newBox.min.y;

 root.add(model);

 character=model;

 console.log('Model height:',size.y);
 console.log('Model scale:',scale);

}

// ==================================================
// IN-PLACE ANIMATION PROCESSOR
// ==================================================

function createInPlaceClip(originalClip){

 const clip=originalClip.clone();

 clip.tracks=clip.tracks.filter(track=>{

  const name=track.name.toLowerCase();

  const isPosition=name.endsWith('.position');

  if(!isPosition)return true;

  // Root / Armature object movement must not move
  // the whole character through the world.
  const isRootObject=
   /^(armature|root|scene|group)\.position$/.test(name);

  if(isRootObject){
   return false;
  }

  return true;

 });

 // Freeze horizontal displacement of the Hips bone.
 // Preserve vertical movement for natural body motion.

 for(const track of clip.tracks){

  const name=track.name.toLowerCase();

  if(!name.endsWith('.position'))continue;

  if(!/hips|pelvis/.test(name))continue;

  const values=track.values;

  if(values.length<3)continue;

  const x=values[0];
  const z=values[2];

  for(let i=0;i<values.length;i+=3){

   values[i]=x;
   values[i+2]=z;

  }

  track.values=values;

 }

 clip.resetDuration();

 return clip;

}

// ==================================================
// ANIMATION BLENDING
// ==================================================

function playAnimation(action,fade){

 if(!action)return;

 if(activeAction===action)return;

 action.enabled=true;
 action.setEffectiveWeight(1);
 action.setEffectiveTimeScale(1);

 if(activeAction){

  activeAction.crossFadeTo(
   action,
   fade,
   true
  );

 }

 action.reset();
 action.play();

 activeAction=action;

}

// ==================================================
// LOAD CHARACTER
// ==================================================

async function loadCharacter(){

 try{

  const loadText=document.getElementById('loadText');

  loadText.textContent='Idle FBX yuklanmoqda...';

  const idleModel=await fbxLoader.loadAsync('idle.fbx');

  prepareModel(idleModel);

  mixer=new THREE.AnimationMixer(character);

  if(idleModel.animations.length){

   idleAction=mixer.clipAction(
    idleModel.animations[0]
   );

   idleAction.setLoop(THREE.LoopRepeat);
   idleAction.play();

   activeAction=idleAction;

  }

  loadText.textContent='Walk FBX yuklanmoqda...';

  const walkModel=await fbxLoader.loadAsync(
   'standartwalk.fbx'
  );

  if(walkModel.animations.length){

   const walkClip=createInPlaceClip(
    walkModel.animations[0]
   );

   walkAction=mixer.clipAction(walkClip);

   walkAction.setLoop(THREE.LoopRepeat);
   walkAction.clampWhenFinished=false;

  }

  // Diagnose skeleton and animation tracks
  console.log('IDLE TRACKS:',
   idleModel.animations[0]?.tracks.map(t=>t.name)
  );

  console.log('WALK TRACKS:',
   walkModel.animations[0]?.tracks.map(t=>t.name)
  );

  characterLoaded=true;

  document.getElementById('loading').style.display='none';

 }catch(error){

  console.error(error);

  document.getElementById('loadText').textContent=
   'Yuklash xatosi: '+error.message;

 }

}

await loadCharacter();

// ==================================================
// INPUT
// ==================================================

const keys={};

window.addEventListener('keydown',e=>{
 keys[e.code]=true;
});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

window.addEventListener('blur',()=>{
 for(const key in keys)keys[key]=false;
});

// ==================================================
// GAME START
// ==================================================

let started=false;

document.getElementById('startBtn').addEventListener(
 'click',()=>{

  if(!characterLoaded)return;

  started=true;

  document.getElementById('start').style.display='none';

  renderer.domElement.requestPointerLock();

 }
);

renderer.domElement.addEventListener('click',()=>{

 if(started&&!document.pointerLockElement){
  renderer.domElement.requestPointerLock();
 }

});

// ==================================================
// CAMERA CONTROLLER
// ==================================================

let yaw=0;
let pitch=0.08;

let cameraInitialized=false;

window.addEventListener('mousemove',e=>{

 if(!document.pointerLockElement)return;

 yaw-=e.movementX*CONFIG.cameraSensitivity;

 pitch-=e.movementY*CONFIG.cameraSensitivity;

 pitch=THREE.MathUtils.clamp(
  pitch,
  CONFIG.minPitch,
  CONFIG.maxPitch
 );

});

// ==================================================
// MOVEMENT SYSTEM
// ==================================================

const velocity=new THREE.Vector3();
const inputDirection=new THREE.Vector3();

const forward=new THREE.Vector3();
const right=new THREE.Vector3();

const targetCameraPosition=new THREE.Vector3();
const targetLookPosition=new THREE.Vector3();

const clock=new THREE.Clock();

let movementState='IDLE';

function damp(current,target,lambda,dt){

 return THREE.MathUtils.damp(
  current,target,lambda,dt
 );

}

function smoothRotation(current,target,dt){

 let difference=Math.atan2(
  Math.sin(target-current),
  Math.cos(target-current)
 );

 return current+
 difference*(1-Math.exp(-CONFIG.rotationSpeed*dt));

}

// ==================================================
// CAMERA COLLISION
// ==================================================

const raycaster=new THREE.Raycaster();

function getSafeCameraPosition(target,desired){

 const direction=new THREE.Vector3()
  .subVectors(desired,target);

 const distance=direction.length();

 if(distance===0)return desired;

 direction.normalize();

 raycaster.set(target,direction);
 raycaster.far=distance;

 const hits=raycaster.intersectObject(ground,false);

 // Ground should not be used as a camera obstacle
 // This controller keeps the camera above ground.
 const safe=desired.clone();

 safe.y=Math.max(safe.y,0.35);

 return safe;

}

// ==================================================
// MAIN UPDATE
// ==================================================

function updateMovement(dt){

 if(!character)return;

 let forwardInput=0;
 let sideInput=0;

 if(keys.KeyW||keys.ArrowUp)forwardInput++;
 if(keys.KeyS||keys.ArrowDown)forwardInput--;

 if(keys.KeyD||keys.ArrowRight)sideInput++;
 if(keys.KeyA||keys.ArrowLeft)sideInput--;

 const hasInput=forwardInput!==0||sideInput!==0;
 const sprint=!!(keys.ShiftLeft||keys.ShiftRight);

 // Camera-relative directions

 forward.set(
  Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 right.set(
  Math.cos(yaw),
  0,
  Math.sin(yaw)
 );

 inputDirection.set(0,0,0);

 inputDirection.addScaledVector(
  forward,forwardInput
 );

 inputDirection.addScaledVector(
  right,sideInput
 );

 if(inputDirection.lengthSq()>0){
  inputDirection.normalize();
 }

 const targetSpeed=hasInput
  ?(sprint?CONFIG.sprintSpeed:CONFIG.walkSpeed)
  :0;

 const acceleration=hasInput
  ?CONFIG.acceleration
  :CONFIG.deceleration;

 const currentSpeed=velocity.length();

 const newSpeed=damp(
  currentSpeed,
  targetSpeed,
  acceleration,
  dt
 );

 if(hasInput){

  velocity.copy(inputDirection).multiplyScalar(newSpeed);

  // Rotate body toward movement direction

  const targetAngle=Math.atan2(
   inputDirection.x,
   inputDirection.z
  );

  root.rotation.y=smoothRotation(
   root.rotation.y,
   targetAngle,
   dt
  );

 }else{

  velocity.setLength(Math.max(0,newSpeed));

  if(newSpeed<0.03){
   velocity.set(0,0,0);
  }

 }

 // World movement is controlled ONLY here.
 // Animation does not translate the character root.

 root.position.addScaledVector(
  velocity,
  dt
 );

 const actualSpeed=velocity.length();

 const moving=actualSpeed>0.15;

 if(moving){

  playAnimation(
   walkAction,
   CONFIG.animationFade
  );

  if(walkAction){

   const speedRatio=actualSpeed/CONFIG.walkSpeed;

   walkAction.timeScale=THREE.MathUtils.clamp(
    CONFIG.walkAnimationSpeed*speedRatio,
    0.65,
    1.6
   );

  }

  movementState=sprint?'SPRINT':'WALK';

 }else{

  playAnimation(
   idleAction,
   CONFIG.animationFade
  );

  if(idleAction){
   idleAction.timeScale=1;
  }

  movementState='IDLE';

 }

}

// ==================================================
// CAMERA UPDATE
// ==================================================

function updateCamera(dt){

 const targetY=
  root.position.y+CONFIG.cameraTargetHeight;

 targetLookPosition.set(
  root.position.x,
  targetY,
  root.position.z
 );

 const horizontalDistance=
  CONFIG.cameraDistance*Math.cos(pitch);

 targetCameraPosition.set(

  root.position.x+
   Math.sin(yaw)*horizontalDistance,

  targetY+
   CONFIG.cameraHeight+
   CONFIG.cameraDistance*Math.sin(pitch),

  root.position.z+
   Math.cos(yaw)*horizontalDistance

 );

 const safePosition=getSafeCameraPosition(
  targetLookPosition,
  targetCameraPosition
 );

 const smooth=1-Math.exp(
  -CONFIG.cameraSmooth*dt
 );

 if(!cameraInitialized){

  camera.position.copy(safePosition);
  cameraInitialized=true;

 }else{

  camera.position.lerp(
   safePosition,
   smooth
  );

 }

 camera.lookAt(targetLookPosition);

}

// ==================================================
// GAME LOOP
// ==================================================

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.04);

 if(mixer){
  mixer.update(dt);
 }

 if(started&&character){

  updateMovement(dt);
  updateCamera(dt);

  document.getElementById('status').innerHTML=
   '<span id="dot"></span>'+movementState;

 }

 renderer.render(scene,camera);

}

animate();

// ==================================================
// RESIZE
// ==================================================

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
