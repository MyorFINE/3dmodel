<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
    <!-- Three.js va zaruriy kutubxonalar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3>Boshqaruv:</h3>
        <p><b>W, A, S, D</b> - Personajni harakatlantirish (Yurganda animatsiya ishlaydi)</p>
        <p>Sichqoncha - Kamerani aylanib ko'rish</p>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let model, mixer;
        let walkAction; // Animatsiyani boshqarish uchun o'zgaruvchi
        let clock = new THREE.Clock();

        const keys = { w: false, a: false, s: false, d: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0a0a0);
            scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

            // Kamerani personajga yaqinroq va ortiga o'rnatamiz
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 2.5, 4);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff);
            dirLight.position.set(3, 10, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Yer tekisligi
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false })
            );
            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const grid = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.minDistance = 1.5;
            controls.maxDistance = 6; // Kameraning uzoqlashish chegarasi qisqartirildi
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Teksturalarni yuklaymiz
            const textureLoader = new THREE.TextureLoader();
            const textures = {
                body: textureLoader.load('middleage_lightskinned_male_diffuse2.png'),
                suit: textureLoader.load('male_casualsuit03_diffuse.png'),
                shoes: textureLoader.load('shoes05_diffuse.png'),
                shorts: textureLoader.load('short02_diffuse.png'),
                eyes: textureLoader.load('brown_eye.png'),
                teeth: textureLoader.load('teeth.png'),
                tongue: textureLoader.load('tongue01_diffuse.png')
            };

            const loader = new THREE.FBXLoader();
            loader.load('standartwalk.fbx', function (object) {
                model = object;
                model.scale.setScalar(0.02);

                model.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        const matName = child.material.name ? child.material.name.toLowerCase() : '';
                        const meshName = child.name ? child.name.toLowerCase() : '';

                        if ((matName.includes('shoe') || meshName.includes('shoe')) && textures.shoes) {
                            child.material.map = textures.shoes;
                        } else if ((matName.includes('short') || meshName.includes('short')) && textures.shorts) {
                            child.material.map = textures.shorts;
                        } else if ((matName.includes('suit') || matName.includes('body') || meshName.includes('body')) && textures.suit) {
                            child.material.map = textures.suit;
                        } else if ((matName.includes('eye') || meshName.includes('eye')) && textures.eyes) {
                            child.material.map = textures.eyes;
                        } else if ((matName.includes('teeth') || meshName.includes('teeth')) && textures.teeth) {
                            child.material.map = textures.teeth;
                        } else if ((matName.includes('tongue') || meshName.includes('tongue')) && textures.tongue) {
                            child.material.map = textures.tongue;
                        } else if (textures.body) {
                            child.material.map = textures.body;
                        }

                        child.material.needsUpdate = true;
                    }
                });

                // Animatsiyani yuklaymiz, lekin darhol o'ynatmaymiz (STOP holatida turadi)
                if (object.animations && object.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    walkAction = mixer.clipAction(object.animations[0]);
                    // walkAction boshida o'chiq turadi
                }

                scene.add(model);
            }, undefined, function (error) {
                console.error("FBX yuklashda xatolik:", error);
            });

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));

            animate();
        }

        function handleKey(event, isPressed) {
            const key = event.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = isPressed;
            }
        }

        function updateMovement(delta) {
            if (!model) return;

            const moveSpeed = 3.0 * delta;
            const moveVector = new THREE.Vector3();

            if (keys.w) moveVector.z -= 1;
            if (keys.s) moveVector.z += 1;
            if (keys.a) moveVector.x -= 1;
            if (keys.d) moveVector.x += 1;

            // Harakatlanish va animatsiyani boshqarish
            if (moveVector.lengthSq() > 0) {
                moveVector.normalize();
                const cameraAngle = Math.atan2(
                    camera.position.x - model.position.x,
                    camera.position.z - model.position.z
                );
                const angle = Math.atan2(moveVector.x, moveVector.z) + cameraAngle;
                model.rotation.y = angle + Math.PI;
                model.position.x += Math.sin(angle) * moveSpeed;
                model.position.z += Math.cos(angle) * moveSpeed;

                // WASD bosilganda animatsiyani ishga tushiramiz
                if (walkAction && !walkAction.isRunning()) {
                    walkAction.play();
                }
            } else {
                // Hech q
